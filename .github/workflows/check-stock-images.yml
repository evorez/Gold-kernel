# Fast check for the two Drive links: download + inspect only, no kernel build.
# Exists because fetching the stock images is the one step that depends on how the
# files are shared, and waiting ~10 minutes (repo sync) to find out is silly.
name: Check stock boot images

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: "Share/direct URL of your ROM's boot.img"
        required: true
        type: string
      vendor_boot_url:
        description: "Share/direct URL of your ROM's vendor_boot.img (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: download + inspect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Fetch + inspect boot.img
        run: |
          set -euo pipefail
          mkdir -p /tmp/stock
          python3 scripts/fetch_image.py "${{ inputs.boot_img_url }}" /tmp/stock/boot.img "ANDROID!"
          python3 scripts/bootimg.py inspect /tmp/stock/boot.img | tee /tmp/boot.json
          {
            echo "### boot.img"
            echo '```json'
            cat /tmp/boot.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Extract the stock config and list what WE add on top of it
        run: |
          set -euo pipefail
          python3 scripts/bootimg.py config /tmp/stock/boot.img /tmp/stock.config
          python3 - <<'PY'
          import sys
          stock = set(open("/tmp/stock.config", encoding="utf-8", errors="replace").read().splitlines())

          def state(spec):
              if spec.startswith("!"):
                  return "off" if f"# {spec[1:]} is not set" in stock else "ON"
              return "on" if spec in stock else "off"

          added, same, off = [], 0, []
          for raw in open("configs/gold-features.config", encoding="utf-8"):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              kind, _, spec = line.partition(" ")
              spec = spec.strip()
              want_off = spec.startswith("!")
              base = spec[1:] if want_off else spec.split("=")[0]
              now = state(spec) if want_off else ("on" if spec in stock else "off")
              if want_off:
                  if now == "off":
                      same += 1
                  else:
                      added.append(f"{base} (we force it OFF, stock has it ON)")
              elif now == "on":
                  same += 1
              else:
                  added.append(spec)
              if kind not in ("REQ", "OPT"):
                  print(f"::warning::unknown marker in the fragment: {line}")

          print(f"::notice::stock config: {len(stock)} lines; {same} of our options already match stock")
          for a in added[:40]:
              print(f"::notice::WE ADD: {a}")
          if len(added) > 40:
              print(f"::notice::... and {len(added) - 40} more")
          keys = ("CONFIG_LOCALVERSION", "CONFIG_MODULE_SIG_PROTECT", "CONFIG_MODVERSIONS",
                  "CONFIG_LRU_GEN", "CONFIG_UCLAMP_TASK", "CONFIG_MODULE_SIG_FORCE",
                  "CONFIG_DEBUG_INFO_BTF", "CONFIG_KSU")
          for k in keys:
              hit = [l for l in stock if l.startswith(k + "=") or l == f"# {k} is not set"]
              print(f"::notice::STOCK {k}: {hit[0] if hit else '(absent)'}")
          PY

      - name: "Stock config A: everything that decides whether vendor modules load"
        run: |
          set -euo pipefail
          grep -E '^(CONFIG_(MODVERSIONS|MODULE_SIG|MODULE_SIG_ALL|MODULE_SIG_FORCE|MODULE_SIG_PROTECT|MODULE_SIG_HASH|MODULE_COMPRESS_NONE|MODULE_FORCE_LOAD|MODULE_UNLOAD|TRIM_UNUSED_KSYMS)=|# CONFIG_(MODVERSIONS|MODULE_SIG|MODULE_SIG_FORCE|MODULE_SIG_PROTECT|MODULE_FORCE_LOAD) is not set)' /tmp/stock.config \
            | sed 's/^/::notice::STOCK /' || echo "::notice::STOCK (no module-signing options found)"

      - name: "Stock config B: ABI-sensitive scheduler / memory / toolchain options"
        run: |
          set -euo pipefail
          grep -E '^(CONFIG_(LOCALVERSION|LOCALVERSION_AUTO|LRU_GEN|PSI|MEMCG|UCLAMP_TASK|UCLAMP_BUCKETS_COUNT|LTO_NONE|LTO_CLANG|CFI_CLANG|KSU|KPROBES|VMLINUX_MAP)=|# CONFIG_(LRU_GEN|PSI|MEMCG|UCLAMP_TASK|LTO_NONE|CFI_CLANG) is not set)' /tmp/stock.config \
            | sed 's/^/::notice::STOCK /' || echo "::notice::STOCK (no layout options found)"

      - name: Report the layout as annotations (logs are not always reachable)
        run: |
          set -euo pipefail
          for f in header_version cmdline os_version_raw kernel_size kernel_payload ramdisk_size tail_size signature_size file_size; do
            v="$(python3 -c "import json;print(json.load(open('/tmp/boot.json')).get('$f'))")"
            echo "::notice::boot.img $f = $v"
          done

      - name: Fetch + inspect vendor_boot.img
        if: ${{ inputs.vendor_boot_url != '' }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_image.py "${{ inputs.vendor_boot_url }}" /tmp/stock/vendor_boot.img "VNDRBOOT"
          python3 scripts/bootimg.py vendor /tmp/stock/vendor_boot.img | tee /tmp/vendor.json
          {
            echo "### vendor_boot.img"
            echo '```json'
            cat /tmp/vendor.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          for f in header_version page_size vendor_ramdisk_size dtb_size cmdline; do
            v="$(python3 -c "import json;print(json.load(open('/tmp/vendor.json')).get('$f'))")"
            echo "::notice::vendor_boot.img $f = $v"
          done
