name: Build GOLD custom kernel (android15-6.6, 4 KB, root + tweaks)

# Custom kernel for the Xiaomi Redmi Note 13 5G (codename gold), built entirely in
# CI from Google's canonical GKI source at the exact tag the phone runs:
#   uname -r 6.6.118-android15-8-ge56cf6b09cca-ab15511674-4k
#   -> kernel/common android15-6.6-2026-01_r34 = e56cf6b09cca..., 6.6.118, 4 KB pages
#
# What makes it "custom":
#   * root: KernelSU (default) or KernelSU-Next, built into the Image
#   * SUSFS root hiding (susfs4ksu kernel + KernelSU patches, pinned as a pair)
#   * tweaks: the whole list in configs/gold-features.config (schedutil/EAS/uclamp,
#     cpusets, PSI, memcg, zram compression algos, MGLRU, ext4/F2FS/EROFS + inline
#     crypto, mq-deadline, pstore/ramoops, WireGuard, exFAT, NTFS3, gamepad HID,
#     BBR+fq default) - all built in, no module to push
#   * kernel name suffixed "...-4k-HAVOC" so a flashed build is identifiable
#   * project name: GoldenEra (author 𝙴𝚟𝚘𝚛𝚎𝚣) - appears in the release title,
#     the zip/boot.img names and NOTES.txt
#   * deliverables are the kernel itself: Image, Image.gz, AnyKernel3 zip
#
# Safety: CI only compiles and packages. Nothing is flashed, and no boot.img is
# packed - the deliverable is the kernel (Image, Image.gz, AnyKernel3 zip). A
# custom kernel ALWAYS needs a stock boot.img kept aside for rollback. Read
# docs/FLASH.md before flashing.
#
# Diagnostics: run logs are not retrievable via the API from all environments, so
# risky steps echo their most useful lines as ::error:: annotations (readable via
# the check-runs annotations API) before exiting non-zero.

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Which kernel branding this build carries. HAVOC -> uname -r ends in -4k-HAVOC; GoldenEra-v1 -> -4k-GoldenEra-v1. Both live in the same release, prefixed."
        type: choice
        options: [HAVOC, GoldenEra-v1]
        default: HAVOC
      root_flavor:
        description: "Root solution for this build. bakasu = BakaSU builtin (CONFIG_KSU=y); none = vanilla (no root at all)"
        type: choice
        options: [bakasu, none]
        default: bakasu
      use_susfs:
        description: "SUSFS root hiding. Only KernelSU has verified in-tree SUSFS; BakaSU+SUSFS is redirected off (not a performance feature)"
        type: boolean
        default: false
      tweaks:
        description: "Feature set from configs/gold-features.config (schedutil/EAS/uclamp, PSI, zram algos, FS, pstore, extras)"
        type: boolean
        default: true
      dev_build:
        description: "Ftrace/perf development extras (configs/gold-devbuild.config) - debug builds only"
        type: boolean
        default: false
      publish_release:
        description: "Attach the build files to a GitHub Release (permanent download link, no 14-day expiry)"
        type: boolean
        default: false
      release_tag:
        description: "Release to publish into. One stable tag holds exactly the newest kernel; older gold-* releases are pruned automatically"
        type: string
        default: "builds"
      ksu_ref:
        description: "Root repo ref/commit (empty = pinned known-good pair: KSU 64833c00)"
        type: string
        default: ""
      susfs_ref:
        description: "susfs4ksu commit on gki-android15-6.6 (empty = branch tip)"
        type: string
        default: "f98f08223bbf469cc0a1542166383d253557fc32"
      crc_stub:
        description: "Skip genksyms CRC comparison (only if vendor modules complain)"
        type: boolean
        default: false
      extra_config:
        description: "Extra defconfig lines, one per row (e.g. CONFIG_FOO=y)"
        type: string
        default: ""
      boot_img_url:
        description: "Direct/share URL of YOUR ROM's boot.img - if given, a boot.img is repacked with only the kernel swapped"
        type: string
        default: ""
      vendor_boot_url:
        description: "Direct/share URL of YOUR ROM's vendor_boot.img (reference only: dtb/vendor ramdisk are never modified)"
        type: string
        default: ""
      stock_symvers_url:
        description: "Reference Module.symvers for the hard CRC check (empty = the stock GKI build 15511674)"
        type: string
        default: "https://ci.android.com/builds/submitted/15511674/kernel_aarch64/latest/raw/kernel_aarch64_Module.symvers"
      formats:
        description: "Artifacts to package"
        type: choice
        options:
          - "anykernel,image"
          - "image"
          - "anykernel"
        default: "anykernel,image"

# Deliberately NOT cancel-in-progress for manual dispatches: bisecting a bootloop
# means running several variants (root only, tweaks only, stock parity) side by
# side, and a blanket cancel-in-progress silently killed the variant that was
# already 15 minutes in. Only superseded PR/push builds get cancelled.
concurrency:
  group: gold-custom-${{ github.ref }}-${{ github.event_name }}-${{ inputs.root_flavor }}-${{ inputs.tweaks }}-${{ inputs.use_susfs }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  MANIFEST_URL: https://android.googlesource.com/kernel/manifest
  MANIFEST_REF: common-android15-6.6-2026-01
  COMMON_TAG: android15-6.6-2026-01_r34
  EXPECTED_FULL_SHA: e56cf6b09cca2151bcee244b3d334fb68685ff57
  EXPECTED_VERSION: 6.6.118
  GKI_BUILD_ID: "15511674"
  KERNEL_NAME: GoldenEra
  BRAND: ${{ inputs.brand }}
  LOCALVERSION_EXTRA: ${{ inputs.brand == 'GoldenEra-v1' && '-GoldenEra-v1' || '-HAVOC' }}
  BRAND_LABEL: ${{ inputs.brand == 'GoldenEra-v1' && 'Golden Era V1' || 'Havoc-GoldenEra Perf' }}
  BOOT_LABEL: ${{ inputs.brand == 'GoldenEra-v1' && 'Golden Era V1' || 'Havoc-GoldenEra' }}
  ROOT_FLAVOR: ${{ inputs.root_flavor }}
  USE_SUSFS: ${{ inputs.use_susfs }}
  TWEAKS: ${{ inputs.tweaks }}
  DEV_BUILD: ${{ inputs.dev_build }}
  PUBLISH_RELEASE: ${{ inputs.publish_release }}
  KSU_REF: ${{ inputs.ksu_ref }}
  SUSFS_REF: ${{ inputs.susfs_ref }}
  CRC_STUB: ${{ inputs.crc_stub }}
  EXTRA_CONFIG: ${{ inputs.extra_config }}
  BOOT_IMG_URL: ${{ inputs.boot_img_url }}
  VENDOR_BOOT_URL: ${{ inputs.vendor_boot_url }}
  STOCK_SYMVERS_URL: ${{ inputs.stock_symvers_url }}
  FORMATS: ${{ inputs.formats }}

jobs:
  build:
    name: gold custom (${{ inputs.root_flavor }}, susfs=${{ inputs.use_susfs }}, tweaks=${{ inputs.tweaks }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write   # only used by the optional release step below
    steps:
      - name: Checkout this repo (scripts + docs)
        uses: actions/checkout@v5

      - name: Free disk space for the GKI checkout
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android || true
          df -h

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl python3 zip unzip ca-certificates patch
          if ! command -v repo >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends repo || {
              curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
              chmod 755 /tmp/repo
              sudo mv /tmp/repo /usr/local/bin/repo
            }
          fi
          repo --version

      - name: Repo init (manifest branch)
        run: |
          set -e
          WS="$GITHUB_WORKSPACE/gki"
          mkdir -p "$WS"
          cd "$WS"
          git config --global user.email "gold-kernel-ci@invalid"
          git config --global user.name "gold-kernel-ci"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_REF" --depth=1

      - name: Pin common to the exact release tag (local manifest)
        run: |
          set -e
          WS="$GITHUB_WORKSPACE/gki"
          mkdir -p "$WS/.repo/local_manifests"
          cat > "$WS/.repo/local_manifests/gold-pin.xml" <<'EOF'
          <manifest>
            <remove-project name="kernel/common" path="common" />
            <project path="common" name="kernel/common"
                     revision="refs/tags/android15-6.6-2026-01_r34"
                     upstream="android15-6.6-2026-01"
                     dest-branch="android15-6.6-2026-01" />
          </manifest>
          EOF
          cat "$WS/.repo/local_manifests/gold-pin.xml"

      - name: Repo sync (depth 1)
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/gki"
          repo sync -j"$(nproc)" 2>&1 | tee /tmp/repo-sync.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error::repo sync failed (exit $rc). Matching log lines:"
            grep -iE 'fatal|error|not found|denied|refus|invalid|cannot|unable|failed|malformed' /tmp/repo-sync.log | tail -25 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g')
              echo "::error::sync: ${esc:0:250}"
            done
            exit $rc
          fi

      - name: Verify the pinned source matches the phone's kernel
        run: |
          cd "$GITHUB_WORKSPACE/gki/common"
          SHA=$(git rev-parse HEAD)
          DESC=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "not-on-tag")
          V1=$(awk -F'=' '/^VERSION =/{gsub(/ /,"",$2);print $2}' Makefile)
          V2=$(awk -F'=' '/^PATCHLEVEL =/{gsub(/ /,"",$2);print $2}' Makefile)
          V3=$(awk -F'=' '/^SUBLEVEL =/{gsub(/ /,"",$2);print $2}' Makefile)
          VER="$V1.$V2.$V3"
          echo "::notice::common HEAD $SHA ($DESC), version $VER"
          if [ "$SHA" != "$EXPECTED_FULL_SHA" ]; then
            echo "::error::common HEAD $SHA != expected $EXPECTED_FULL_SHA ($COMMON_TAG). Refusing to build unverified source."
            exit 1
          fi
          if [ "$VER" != "$EXPECTED_VERSION" ]; then
            echo "::error::kernel version $VER != expected $EXPECTED_VERSION"
            exit 1
          fi

      - name: Fetch the stock boot images (optional, for a ready-to-flash boot.img)
        if: ${{ inputs.boot_img_url != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/stock"
          python3 "$GITHUB_WORKSPACE/scripts/fetch_image.py" \
            "$BOOT_IMG_URL" "$GITHUB_WORKSPACE/stock/boot.img" "ANDROID!"
          python3 "$GITHUB_WORKSPACE/scripts/bootimg.py" \
            inspect "$GITHUB_WORKSPACE/stock/boot.img" | sed 's/^/    /'
          if [ -n "${VENDOR_BOOT_URL:-}" ]; then
            python3 "$GITHUB_WORKSPACE/scripts/fetch_image.py" \
              "$VENDOR_BOOT_URL" "$GITHUB_WORKSPACE/stock/vendor_boot.img" "VNDRBOOT"
            python3 "$GITHUB_WORKSPACE/scripts/bootimg.py" \
              vendor "$GITHUB_WORKSPACE/stock/vendor_boot.img" | sed 's/^/    /'
          else
            echo "::notice::no vendor_boot_url given; the dtb/vendor ramdisk are not inspected (they are never modified either way)"
          fi

      - name: Align config with the stock gold kernel
        run: bash "$GITHUB_WORKSPACE/scripts/fix-gki-config.sh" "$GITHUB_WORKSPACE/gki"

      - name: Apply the feature set (configs/gold-features.config)
        if: ${{ inputs.tweaks || inputs.dev_build }}
        run: bash "$GITHUB_WORKSPACE/scripts/apply-tweaks.sh" "$GITHUB_WORKSPACE/gki"

      - name: Integrate root + SUSFS
        run: bash "$GITHUB_WORKSPACE/scripts/apply-root.sh" "$GITHUB_WORKSPACE/gki"

      - name: Build GKI kernel (aarch64, 4 KB pages)
        env:
          # Kleaf builds reproducibly, which pins the banner date to the epoch:
          # "6.6.118-... #1 Thu Jan  1 00:00:00 UTC 1970". Hand it the real epoch;
          # if the rules ignore it the banner stays as it was, nothing else changes.
          GOLD_BUILD_DATE: ${{ github.run_started_at }}
        run: |
          set +e
          SOURCE_DATE_EPOCH="$(date -u -d "$GOLD_BUILD_DATE" +%s 2>/dev/null || echo 0)"
          export SOURCE_DATE_EPOCH
          echo "build epoch: $SOURCE_DATE_EPOCH"
          cd "$GITHUB_WORKSPACE/gki"
          if [ ! -x tools/bazel ]; then
            echo "::error::tools/bazel not found after repo sync."
            exit 1
          fi
          # SukiSU exports symbols that are not in GKI's KMI list, so Kleaf's
          # strict-mode check (no additions, no removals) rejects the build:
          #   Checking for kmi_symbol_list_strict_mode ... failed
          # Additions cannot break a prebuilt module (it needs the symbols it was
          # linked against, which our own KMI gate still verifies by CRC and by
          # "no symbol that stock exports may disappear"), so relax only Kleaf's
          # check, only for that flavor.
          BAZEL_OPTS=""
          case "${EFFECTIVE_ROOT_FLAVOR:-none}" in
            sukisu|bakasu) BAZEL_OPTS="--nokmi_symbol_list_strict_mode" ;;
          esac
          tools/bazel run $BAZEL_OPTS //common:kernel_aarch64_dist -- --destdir="$GITHUB_WORKSPACE/dist" 2>&1 | tee /tmp/bazel.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error::Bazel build failed (exit $rc). Matching log lines:"
            # Run logs are not reachable from every environment, so the annotations
            # are the only window into a failure. Emit both the error-looking lines
            # and the context around the driver that failed, which is where a root
            # fork's own build system usually complains.
            {
              grep -iE 'error|FAILED|fatal|cannot|no such|no rule|denied|refused|permission|timeout|undefined|not found|missing|submodule|not supported|unsupported' /tmp/bazel.log \
                | grep -viE 'warning|Werror=|_ERROR_|-D[A-Z_]*ERROR' | tail -28
              echo "--- context around drivers/kernelsu ---"
              grep -n -B4 -A10 'drivers/kernelsu' /tmp/bazel.log | tail -22
              echo "--- tail ---"
              tail -18 /tmp/bazel.log
            } | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g')
              echo "::error::bazel: ${esc:0:240}"
            done
            exit $rc
          fi

      - name: Verify the built Image (config read back from the Image)
        run: |
          export EFFECTIVE_ROOT_FLAVOR="${EFFECTIVE_ROOT_FLAVOR:-none}"
          export EFFECTIVE_USE_SUSFS="${EFFECTIVE_USE_SUSFS:-false}"
          export EFFECTIVE_USE_KPM="${EFFECTIVE_USE_KPM:-false}"
          bash "$GITHUB_WORKSPACE/scripts/verify-build.sh" "$GITHUB_WORKSPACE/gki"

      - name: Policy gate (DO NOT INCLUDE contract)
        run: bash "$GITHUB_WORKSPACE/scripts/check-policy.sh" "$GITHUB_WORKSPACE/gki" /tmp/built.config

      - name: KMI gate (prebuilt vendor modules must still resolve)
        run: |
          REF=""
          if [ -n "${STOCK_SYMVERS_URL:-}" ]; then
            if curl -fsSL "$STOCK_SYMVERS_URL" -o /tmp/stock.symvers; then
              REF=/tmp/stock.symvers
              echo "::notice::reference symvers downloaded ($(wc -l </tmp/stock.symvers) symbols)"
            else
              echo "::warning::could not download stock_symvers_url; only the KMI removal check runs"
            fi
          else
            echo "::notice::no stock_symvers_url given; checking KMI list and symbol removal only (no CRC parity)"
          fi
          bash "$GITHUB_WORKSPACE/scripts/check-kmi.sh" "$GITHUB_WORKSPACE/gki" "$REF"

      - name: Show dist contents
        run: find "$GITHUB_WORKSPACE/dist" -type f | sort | sed 's/^/    /'

      - name: Package artifacts
        run: |
          export DIST="$GITHUB_WORKSPACE/dist"
          export OUTDIR="$GITHUB_WORKSPACE/artifacts"
          export KERNEL_NAME FORMATS BRAND_LABEL BOOT_LABEL
          if [ -f "$GITHUB_WORKSPACE/stock/boot.img" ]; then
            export STOCK_BOOT="$GITHUB_WORKSPACE/stock/boot.img"
          fi
          if [ -f "$GITHUB_WORKSPACE/stock/vendor_boot.img" ]; then
            export VENDOR_BOOT="$GITHUB_WORKSPACE/stock/vendor_boot.img"
          fi
          bash "$GITHUB_WORKSPACE/scripts/package.sh"

      - name: Build summary
        run: |
          {
            echo "## gold custom kernel"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| GKI base | \`$COMMON_TAG\` = \`$EXPECTED_FULL_SHA\` (kernel $EXPECTED_VERSION, 4 KB pages) |"
            echo "| root | \`${EFFECTIVE_ROOT_FLAVOR:-none}\` (susfs=${EFFECTIVE_USE_SUSFS:-false}) |"
            echo "| rootsu sha | \`${KSU_SHA:-n/a}\` |"
            echo "| tweaks | ${TWEAKS:-false} (configs/gold-features.config) |"
            echo "| dev build | ${DEV_BUILD:-false} (ftrace/perf) |"
            echo "| crc stub | ${CRC_STUB:-false} |"
            echo "| boot.img | $([ -f "$GITHUB_WORKSPACE/artifacts/boot.img" ] && echo "included - repacked from the supplied stock image (header/dtb/ramdisk untouched)" || echo "not built (kernel only)") |"
            echo "| artifacts | $(ls "$GITHUB_WORKSPACE/artifacts" 2>/dev/null | tr '\n' ' ') |"
            echo
            echo "Kernel only - no boot.img is packed. Rollback needs your ROM's stock \`boot.img\`. Read \`docs/FLASH.md\` first."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GoldenEra-${{ inputs.root_flavor }}-susfs${{ inputs.use_susfs }}-${{ github.run_number }}
          path: |
            artifacts/
            /tmp/bazel.log
          retention-days: 14
          if-no-files-found: error

      - name: Publish a GitHub Release (optional permanent download)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          TAG="${TAG:-builds}"
          KVER="${EXPECTED_VERSION}"
          TITLE="Havoc + Golden Era V1 · 𝙴𝚟𝚘𝚛𝚎𝚣 • 6.6.118"

          # Exactly four files in the release, two per brand:
          #   Havoc-GoldenEra Perf kernel 6.6.118.zip / Havoc-GoldenEra Boot.img(A16)
          #   Golden Era V1 kernel 6.6.118.zip        / Golden Era V1 Boot.img(A16)
          ALLOWED="Havoc-GoldenEra Perf kernel ${KVER}.zip|Havoc-GoldenEra Boot.img(A16)|Golden Era V1 kernel ${KVER}.zip|Golden Era V1 Boot.img(A16)"
          MINE="${BRAND_LABEL} kernel ${KVER}.zip ${BOOT_LABEL} Boot.img(A16)"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "Build in progress." \
              || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          # this brand replaces only its own two files
          for a in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            for m in $MINE; do
              [ "$a" = "$m" ] && gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" -y >/dev/null 2>&1 || true
            done
          done

          for f in "$GITHUB_WORKSPACE"/artifacts/*; do
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done

          # anything that is not one of the four allowed names goes away
          for a in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            keep=0
            OLDIFS=$IFS; IFS='|'
            for allowed in $ALLOWED; do
              [ "$a" = "$allowed" ] && keep=1
            done
            IFS=$OLDIFS
            [ "$keep" = 0 ] && gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" -y >/dev/null 2>&1 || true
          done

          {
            echo "**Havoc + Golden Era V1** for the Redmi Note 13 5G (gold) - by 𝙴𝚟𝚘𝚛𝚎𝚣."
            echo
            echo "Same source (\`${EXPECTED_FULL_SHA}\`, \`${COMMON_TAG}\`, kernel ${KVER}, 4 KB pages). Four files, nothing else:"
            echo
            for a in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort); do
              case "$a" in
                *.zip)  echo "- \`$a\` - recovery-flashable (TWRP / SHRP / KernelFlasher)" ;;
                *Boot.img*) echo "- \`$a\` - patched boot image for fastboot: your stock header/ramdisk, only the kernel swapped" ;;
                *) echo "- \`$a\`" ;;
              esac
            done
            echo
            echo "HAVOC boots with maximum ceilings: 2000 MHz little cluster, 2400 MHz big cluster, GPU 1068 MHz (applied by a boot script the zip installs as \`/data/adb/service.d/99-havoc.sh\`; minimums are untouched so thermal still throttles)."
            echo
            echo "Gates: pinned source, config read-back, policy gate, **9444/9444 KMI CRC parity** against stock, boot.img repack assertions."
            echo
            echo "**Not boot-tested.** Keep your stock boot image for rollback."
          } >/tmp/release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file /tmp/release-notes.md

          for old in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            [ "$old" = "$TAG" ] && continue
            echo "removing superseded release $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          done
          echo "release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Diagnostics on failure (annotations)
        if: failure()
        run: |
          echo "::error::Job failed - see annotations above."
          if [ -d "$GITHUB_WORKSPACE/gki/common" ]; then
            echo "::error::common HEAD: $(git -C "$GITHUB_WORKSPACE/gki/common" rev-parse HEAD 2>/dev/null || echo unknown)"
          fi
          [ -f /tmp/bazel.log ] && tail -5 /tmp/bazel.log | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g')
            echo "::error::last: ${esc:0:250}"
          done
