name: Build GOLD GKI baseline (android15-6.6, 4 KB)

# Baseline, unmodified build of the exact Google GKI that the phone reports:
#   uname -r 6.6.118-android15-8-ge56cf6b09cca-ab15511674-4k
#   -> kernel/common tag android15-6.6-2026-01_r34 = commit
#      e56cf6b09cca2151bcee244b3d334fb68685ff57, version 6.6.118, build 15511674, 4 KB pages
#
# Safety: this workflow ONLY compiles. It downloads public AOSP source from Google's
# canonical servers (android.googlesource.com) and uploads the raw kernel image/modules
# as a build artifact. Nothing is flashed to any device. The artifact is NOT-FLASHABLE:
# a raw kernel Image is not a boot.img — the ROM's vbmeta/boot layout and vendor modules
# must be checked before any test on the phone.
#
# Note on diagnostics: run logs are not retrievable via the API from all environments,
# so risky steps echo their most useful lines as ::error:: annotations (readable via the
# check-runs annotations API) before exiting non-zero.

on:
  workflow_dispatch:

concurrency:
  group: gold-gki-baseline
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANIFEST_URL: https://android.googlesource.com/kernel/manifest
  # The manifest branch for the January-2026 android15-6.6 GKI release.
  # The matching kernel/common TAG is pinned below via a local manifest,
  # because the manifest branch pins `common` to a moving branch.
  MANIFEST_REF: common-android15-6.6-2026-01
  COMMON_TAG: android15-6.6-2026-01_r34
  EXPECTED_FULL_SHA: e56cf6b09cca2151bcee244b3d334fb68685ff57
  EXPECTED_VERSION: 6.6.118
  GKI_BUILD_ID: "15511674"

jobs:
  build:
    name: GKI aarch64 4K dist (build 15511674, unmodified)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space for the GKI checkout
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android || true
          df -h

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl python3 zip unzip ca-certificates
          if ! command -v repo >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends repo || {
              curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
              chmod 755 /tmp/repo
              sudo mv /tmp/repo /usr/local/bin/repo
            }
          fi
          repo --version

      - name: Repo init (manifest branch)
        run: |
          set -e
          WS="$GITHUB_WORKSPACE/gki"
          mkdir -p "$WS"
          cd "$WS"
          git config --global user.email "gold-kernel-ci@invalid"
          git config --global user.name "gold-kernel-ci"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_REF" --depth=1

      - name: Pin common to the exact release tag (local manifest)
        run: |
          set -e
          WS="$GITHUB_WORKSPACE/gki"
          mkdir -p "$WS/.repo/local_manifests"
          cat > "$WS/.repo/local_manifests/gold-pin.xml" <<'EOF'
          <manifest>
            <remove-project name="kernel/common" path="common" />
            <project path="common" name="kernel/common"
                     revision="refs/tags/android15-6.6-2026-01_r34"
                     upstream="android15-6.6-2026-01"
                     dest-branch="android15-6.6-2026-01" />
          </manifest>
          EOF
          echo "Local manifest pin:"
          cat "$WS/.repo/local_manifests/gold-pin.xml"

      - name: Repo sync (depth 1)
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/gki"
          repo sync -j"$(nproc)" 2>&1 | tee /tmp/repo-sync.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error::repo sync failed (exit $rc). Matching log lines:"
            grep -iE 'fatal|error|not found|denied|refus|invalid|cannot|unable|failed|malformed' /tmp/repo-sync.log | tail -25 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g')
              echo "::error::sync: ${esc:0:250}"
            done
            exit $rc
          fi

      - name: Verify the pinned source matches the phone's kernel
        run: |
          cd "$GITHUB_WORKSPACE/gki/common"
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short=12 HEAD)
          DESC=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "not-on-tag")
          V1=$(awk -F'=' '/^VERSION =/{gsub(/ /,"",$2);print $2}' Makefile)
          V2=$(awk -F'=' '/^PATCHLEVEL =/{gsub(/ /,"",$2);print $2}' Makefile)
          V3=$(awk -F'=' '/^SUBLEVEL =/{gsub(/ /,"",$2);print $2}' Makefile)
          VER="$V1.$V2.$V3"
          {
            echo "manifest_ref=$MANIFEST_REF"
            echo "common_tag=$COMMON_TAG"
            echo "common_sha=$SHA"
            echo "common_describe=$DESC"
            echo "kernel_version=$VER"
            echo "phone_uname=6.6.118-android15-8-ge56cf6b09cca-ab15511674-4k"
            echo "gki_build_id=$GKI_BUILD_ID"
            echo "page_size=4k"
            echo "modified=no"
          } | tee "$GITHUB_WORKSPACE/build-info.txt"
          echo "::notice::common HEAD $SHA ($DESC), version $VER"
          if [ "$SHA" != "$EXPECTED_FULL_SHA" ]; then
            echo "::error::common HEAD $SHA != expected $EXPECTED_FULL_SHA ($COMMON_TAG). Refusing to build unverified source."
            exit 1
          fi
          if [ "$VER" != "$EXPECTED_VERSION" ]; then
            echo "::error::kernel version $VER != expected $EXPECTED_VERSION"
            exit 1
          fi

      - name: Build GKI kernel (aarch64, 4 KB pages, unmodified config)
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/gki"
          ls -la
          if [ ! -x tools/bazel ]; then
            echo "::error::tools/bazel not found after repo sync. Workspace layout differs from the documented Kleaf flow."
            ls -la tools/ 2>&1 | head -20
            exit 1
          fi
          tools/bazel run //common:kernel_aarch64_dist -- --destdir="$GITHUB_WORKSPACE/dist" 2>&1 | tee /tmp/bazel.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error::Bazel build failed (exit $rc). Matching log lines:"
            grep -iE 'error|FAILED|fatal|cannot|no such|denied|refused|timeout|not found' /tmp/bazel.log | tail -35 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g')
              echo "::error::bazel: ${esc:0:250}"
            done
            echo "::error::bazel: full log tail:"
            tail -15 /tmp/bazel.log | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g')
              echo "::error::tail: ${esc:0:250}"
            done
            exit $rc
          fi

      - name: Show dist contents
        run: |
          find "$GITHUB_WORKSPACE/dist" -type f | sort
          cp "$GITHUB_WORKSPACE/build-info.txt" "$GITHUB_WORKSPACE/dist/build-info.txt"

      - name: Upload artifact (NOT for flashing)
        uses: actions/upload-artifact@v7
        with:
          name: gold-gki-baseline-15511674-NOT-FLASHABLE
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Diagnostics on failure (annotations)
        if: failure()
        run: |
          echo "::error::Job failed — see annotations above."
          if [ -f "$GITHUB_WORKSPACE/build-info.txt" ]; then
            while IFS= read -r line; do echo "::error::build-info: $line"; done < "$GITHUB_WORKSPACE/build-info.txt"
          fi
          if [ -d "$GITHUB_WORKSPACE/gki/common" ]; then
            echo "::error::common HEAD at failure: $(git -C "$GITHUB_WORKSPACE/gki/common" rev-parse HEAD 2>/dev/null || echo unknown)"
          fi
